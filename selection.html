<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Option</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #f4f4f9; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .btn { padding: 20px 40px; font-size: 1.2rem; text-decoration: none; color: white; border-radius: 8px; transition: transform 0.2s; }
        .lost { background-color: #dc3545; }
        .found { background-color: #28a745; }
        .btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <h1>What would you like to do?</h1>
    <div class="btn-container">
        <!-- We add ?type= to the URL so the next page knows which button was clicked -->
        <a href="form.html?type=Lost" class="btn lost">I Lost Something</a>
        <a href="form.html?type=Found" class="btn found">I Found Something</a>
    </div>
</body>
</html>
